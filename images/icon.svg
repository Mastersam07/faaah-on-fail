<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Speaker/horn icon -->
  <g transform="translate(16, 28)">
    <!-- Speaker body -->
    <path d="M0,30 L20,22 L20,50 L0,42 Z" fill="#FFD93D"/>
    <!-- Speaker cone -->
    <path d="M20,22 L55,4 L55,68 L20,50 Z" fill="#FFE066"/>
    <!-- Speaker back plate -->
    <rect x="-4" y="28" width="6" height="16" rx="2" fill="#E8B90A"/>
  </g>
  <!-- Sound waves -->
  <path d="M78 36 Q90 36 90 64 Q90 92 78 92" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M88 26 Q104 26 104 64 Q104 102 88 102" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <path d="M98 18 Q116 18 116 64 Q116 110 98 110" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  <!-- Red exclamation badge -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="18" fill="#FFF" opacity="0.95"/>
    <rect x="-3" y="-10" width="6" height="12" rx="3" fill="#C0392B"/>
    <circle cx="0" cy="7" r="3" fill="#C0392B"/>
  </g>
</svg>
